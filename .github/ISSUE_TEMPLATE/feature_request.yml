name: Feature Request
description: Suggest a new driver or an improvement for magic_socket
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for magic_socket? Say which broadcasting capability is missing and
        what you would build on it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see, and why is it needed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a real scenario where you would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workaround you tried?

  - type: textarea
    id: code
    attributes:
      label: Example Code
      description: How would the API look in practice?
      render: dart
